name: Deploy to Hostinger with CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ----- 1.pengecekan sebelum deploy -----
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes htmlhint@1 index.php
  
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare site copy
        run: |
          mkdir _site
          cp -r assets _site/assets
          cp index.php _site/index.html
      - name: Check Links
        uses: lycheeverse/lychee-action@v2
        with:
            args: >-
              --no-progress --max-retries 3 --timeout 20
              --accept 200,204,429
              --exclude 'linkedin\.com'
              _site/index.html
            fail: true

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      #- name: Debug 403 (temporary)
      #  run: |
      #    for ua in \
      #      "curl/8.0" \
      #      "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
      #      "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) HeadlessChrome/120.0.0.0 Safari/537.36" \
      #      "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome-Lighthouse"
      #    do
      #      printf '%s -> ' "$ua"
      #      curl -s -o /dev/null -w "%{http_code}\n" -A "$ua" https://resume.projectgomsil.com/
      #    done
      - uses: actions/checkout@v7
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          #urls: https://resume.projectgomsil.com/
          configPath: ./lighthouserc.json
          uploadArtifacts: true

  # ---------- Tahap 2: deploy, hanya jika semua cek lulus ----------
        
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [validate-html, link-check, secret-scan, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./public_html/
          #dry-run: true        # hapus baris ini setelah uji pertama berhasil
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            config/**
            lighthouserc.json
            .gitleaksignore
    
  # ---------- Tahap 3: verifikasi setelah deploy ----------

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://resume.projectgomsil.com
    steps:
      - name: Homepage OK and has expected content
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 "$SITE_URL/" -o page.html
          grep -q "Gomgom Silalahi" page.html
      - name: CV is reachable and really a PDF
        run: |
          type=$(curl --fail --silent --show-error --location --retry 3 --head -o /dev/null -w '%{content_type}' "$SITE_URL/assets/Gomgom_Silalahi_Resume.pdf")
          echo "content-type: $type"
          case "$type" in application/pdf*) ;; *) echo "Not a PDF"; exit 1;; esac
      - name: Core assets load
        run: |
          for f in assets/style.css assets/script.js assets/favicon.svg; do
            curl --fail --silent --show-error --location --head -o /dev/null "$SITE_URL/$f"
          done
